name: CI

# Work happens on `dev` and reaches `main` only through a pull request, so both
# branches are watched. The run on `main` is not redundant with the one on the
# pull request: it is the run the release waits on, and it sees the merge commit
# rather than the merge preview.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the run already in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide the state of the other.
      fail-fast: false
      matrix:
        # Both maintained release lines. Node 20 left maintenance in April 2026.
        node: ['22', '24']
        # Windows earns its place here rather than being cargo cult: the
        # transformer recognises a call by matching path segments, and builds
        # those with `path.join`, so it sees backslashes on Windows and forward
        # slashes everywhere else. A regression there would be invisible on
        # Linux alone.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Built before anything else, and as its own step: the type checking and
      # the suites both read the built output — the test harness loads the
      # transformer from it, and the entry point suite runs entirely against the
      # published packages — so a build failure here is reported as a build
      # failure rather than as a confusing pile of missing modules.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # `npm test` would build a second time. Everything it does beyond that is
      # exactly this line.
      - name: Test
        run: npx vitest run --configLoader native

  claude:
    name: .claude tree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No install step, and no `cache: npm` to warm one: the validators are
      # written against Node's standard library alone, so this job runs on a
      # bare checkout. That is also the property being protected — a checker
      # that needed the workspace installed could not report a `.claude` tree
      # broken badly enough to break the install.
      #
      # Only the errors fail the job. The warnings — a skill with no eval
      # suite, one longer than the guidance — are printed on every run and
      # fail under `--strict`, so a skill written before the standard is
      # visible without the whole repository waiting on it.
      - name: Validate
        run: npm run validate:claude

  quality:
    name: lint and formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Neither reads the built output, so this job skips the build entirely and
      # runs once rather than once per matrix entry.
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npx eslint .
