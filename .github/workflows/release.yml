name: Release

# Runs when CI has finished successfully on `main`, which in practice means a
# pull request from `dev` has just been merged.
#
# Publishing is irreversible — a name is taken for good and a version can never
# be reused — so automating it needs a reason to be safe, and there is one:
# `changeset publish` only publishes versions that are **not already on the
# registry**. A merge carrying no version bump therefore publishes nothing at
# all. What decides whether a release happens is the version in the manifests,
# which is reviewed in the pull request like any other change, and not the act
# of merging.
#
# Gated on the whole CI matrix rather than on this workflow's own test run.
# Those are not the same thing: the matrix covers two Node lines and two
# operating systems, and a failure on one of them has been Windows-only before
# now. The build and test steps below stay as a second line of defence, since a
# run that reaches the publish step must not depend on having read the status of
# another workflow correctly.
#
# This cannot publish a package for the very first time. Trusted publishing is
# configured on a package's own settings page, and a package only exists once
# something has been published to it, so there is nothing to attach the
# configuration to beforehand. The first version of each package is published
# from a machine with `npm login`; see "The first publish cannot use it" in the
# README. From the second onwards, this workflow is the only thing that needs
# publish rights, and it holds none of its own.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Kept as an escape hatch: a release that failed after CI had already passed
  # would otherwise need an empty commit to retry.
  workflow_dispatch:

permissions:
  # Lets GitHub mint the OIDC token npm exchanges for publish rights, which is
  # what removes the need for a long-lived token stored as a secret.
  id-token: write
  # Lets the tags `changeset publish` creates be pushed back.
  contents: write

jobs:
  release:
    name: publish to npm
    runs-on: ubuntu-latest

    # `workflow_run` fires whatever CI concluded, failure included, so the
    # conclusion has to be read rather than assumed. A manual dispatch has no
    # such event to read and is allowed through on its own.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit CI passed on, not whatever `main` points at by now.
          # A second merge landing while this runs would otherwise publish code
          # nothing had tested.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node 22.14 or newer; this is the line CI
          # already tests on.
          node-version: '24'
          cache: npm
          # Writes the .npmrc that points the CLI at the public registry. No
          # token goes in it — the OIDC exchange supplies the credential.
          registry-url: 'https://registry.npmjs.org'

      # The bundled npm is usually new enough, but "usually" is not a thing to
      # discover halfway through publishing four packages.
      # Checked, not forced. This step used to run `npm install -g npm@latest`
      # first, which quietly moved the release onto whatever npm shipped that
      # day — and a major bump changed the shape of `npm pack --json`, breaking
      # the suite here while CI stayed green on the npm that setup-node
      # provides. The version that comes with the pinned Node is already new
      # enough; if it ever is not, this fails and says so.
      - name: Ensure npm supports trusted publishing
        run: |
          node - <<'NODE'
          const { execSync } = require('node:child_process');
          const version = execSync('npm --version', { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          const supported =
            major > 11 ||
            (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!supported) {
            console.error(`npm ${version} is too old for trusted publishing; 11.5.1 is the minimum.`);
            process.exit(1);
          }
          console.log(`npm ${version} supports trusted publishing.`);
          NODE

      # A package that has never been published has no settings page, so it has
      # no trusted publisher, so this workflow has no way to authenticate for
      # it. npm answers that with `E404 ... PUT`, which reads like a bug in the
      # repository and is not one. Caught here instead, before anything is
      # published, and said in words.
      - name: Refuse a first publish
        run: |
          node - <<'NODE'
          const { execSync } = require('node:child_process');

          const workspaces = JSON.parse(
            execSync('npm pkg get name --workspaces --json', { encoding: 'utf8' }),
          );

          const names = Object.values(workspaces).filter(
            (name) => typeof name === 'string',
          );

          // Wrapped, because `node -` reads stdin as CommonJS and top level
          // await is not available there.
          const main = async () => {
          const missing = [];

          for (const name of names) {
            const response = await fetch(
              `https://registry.npmjs.org/${name.replace('/', '%2f')}`,
            );

            if (response.status === 404) missing.push(name);
          }

          if (missing.length > 0) {
            console.error(
              [
                'These packages have never been published, and this workflow cannot be',
                'the thing that publishes them first:',
                '',
                ...missing.map((name) => `  - ${name}`),
                '',
                'A trusted publisher is configured on a package’s own settings page on',
                'npmjs.com, and that page does not exist until the package does. Publish',
                'the first version from a machine with `npm login`, using `npm run release`,',
                'then configure the trusted publisher for it. See "The first publish cannot',
                'use it" in the README.',
              ].join('\n'),
            );
            process.exit(1);
          }

          console.log(`Every package already exists: ${names.join(', ')}.`);
          };

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Nothing broken gets published. The entry point suite matters most here:
      # it is the one that resolves the packages by name against the tarball npm
      # would actually upload.
      - name: Test
        run: npx vitest run --configLoader native

      - name: Publish
        run: npx changeset publish

      # `--tags` rather than `--follow-tags`. The checkout above pins an explicit
      # commit, so this runs on a detached HEAD, and `--follow-tags` would try to
      # push the current branch as well — which is not one.
      - name: Push the tags
        run: git push --tags
